<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>East Medinipur Durga Puja</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7f1ff;
            font-family: Georgia, "Times New Roman", serif;
        }


        .hero {
            width: calc(100% - 60px);

            min-height: 570px;

            margin: 21px auto 0;

            background: #4b145f;

            border-bottom: 7px solid #f4c542;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            box-shadow:
                0 12px 30px rgba(51, 20, 80, 0.20);
        }



        .content {
            width: 90%;

            max-width: 1000px;

            margin-top: -5px;
        }


   

        .top-text {
            color: #f8d66d;

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 3px;

            margin-bottom: 24px;
        }



        h1 {
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 60px;

            font-weight: 900;

            line-height: 1.1;

            margin-bottom: 22px;
        }


        

        .description {
            color: #f4c542;

            font-size: 17px;

            font-weight: bold;

            line-height: 1.7;

            max-width: 700px;

            margin: 0 auto 20px;
        }




        .explore {
            width: 420px;

            max-width: 90%;

            height: 52px;

            margin: 20px auto 0;

            background: #f35edf;

            border: none;

            border-radius: 35px;

            display: flex;

            justify-content: center;

            align-items: center;

            color: #5a146b;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 17px;

            font-weight: bold;

            font-style: italic;

            letter-spacing: 6px;

            text-decoration: none;

            transition: 0.3s ease;
        }


        .explore:hover {
            background: #f4c542;

            color: #4b145f;

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.20);
        }


    

        @media (max-width: 900px) {

            .hero {
                width: calc(100% - 40px);
            }

            h1 {
                font-size: 48px;
            }

            .description {
                font-size: 16px;
            }

        }



        @media (max-width: 600px) {

            .hero {
                width: calc(100% - 24px);

                min-height: 520px;
                border-radius: 10px;

                margin-top: 12px;
            }

            .content {
                width: 94%;
            }

            .top-text {
                font-size: 13px;

                letter-spacing: 2px;

                margin-bottom: 20px;
            }

            h1 {
                font-size: 36px;

                line-height: 1.15;
            }

            .description {
                font-size: 15px;

                line-height: 1.6;
            }

            .explore {
                width: 90%;

                height: 50px;

                font-size: 16px;
                color: #041c27;

                letter-spacing: 5px;
            }

        }

    </style>

</head>


<body>


    <section class="hero">

        <div class="content">

            <div class="top-text">
                ~শারদ উৎসব • শারতের আনন্দ • East Medinipur~
            </div>


            <h1>
                East Medinipur Durga Puja
            </h1>


            <p class="description">
                 Celebrate the spirit of Durga Puja in Purba Medinipur —
    where devotion, tradition, culture and happiness come
    together to create unforgettable moments.
            </p>


            <a href="Card.html" target="_blank" class="explore">
                E x p l o r e ➡
            </a>

        </div>

    </section>


</body>

</html>
